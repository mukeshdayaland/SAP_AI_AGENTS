# Lightweight DEV landscape: no PostgreSQL or Audit Log service, and no SAP AI Core binding.
# LLM: SAP AI Core reached through a service key (it may live in another global account),
# with any OpenAI-compatible API (Google Gemini by default) as fallback. SAP data: MCP mock mode,
# persistence: in-memory (lost on restart). Not permitted for QA/PROD.
#
# Build first:  npm ci && npm run build:cf
# Services (once per space):
#   cf create-service xsuaa application prowess-xsuaa -c <xs-security.json with a space-unique xsappname>
#   cf create-service destination lite prowess-destination
#   cf create-service connectivity lite prowess-connectivity
#   cf create-service application-logs lite prowess-logging
#   cf cups prowess-secrets -p '{"SERVICE_ASSERTION_SECRET":"<≥32 random chars>"}'
# Then:  cf push -f infrastructure/cloudfoundry/manifest.dev-lite.yml --var env=<space-suffix> --var domain=<cf-domain>
#        cf set-env prowess-ai-orchestrator OPENAI_COMPAT_API_KEY <key>
#        cf set-env prowess-ai-orchestrator AICORE_SERVICE_KEY '<AI Core service key JSON>'
#        cf restart prowess-ai-orchestrator
---
applications:
  - name: prowess-sap-mcp
    path: ../../apps/sap-mcp/dist
    memory: 256M
    instances: 1
    buildpacks: [nodejs_buildpack]
    command: node --enable-source-maps server.mjs
    health-check-type: http
    health-check-http-endpoint: /health
    routes:
      # Public route like the MTA: /mcp rejects calls without an orchestrator-signed assertion.
      - route: prowess-sap-mcp-((env)).((domain))
    env:
      PROWESS_ENV: DEV
      SAP_MODE: mock
      NODE_ENV: production
    services: [prowess-xsuaa, prowess-destination, prowess-connectivity, prowess-logging, prowess-secrets]

  # Optional: SuccessFactors through the SF_ODATA destination (docs/sap-connectivity.md). Push it by name,
  #   cf push -f infrastructure/cloudfoundry/manifest.dev-lite.yml prowess-sf-mcp --var env=… --var domain=…
  # keep sf out of the MCP_DOMAINS of prowess-sap-mcp, and name both services to the orchestrator:
  #   cf set-env prowess-ai-orchestrator MCP_SERVERS '[{"id":"sap","url":"https://prowess-sap-mcp-<env>.<domain>/mcp"},{"id":"sf","url":"https://prowess-sf-mcp-<env>.<domain>/mcp"}]'
  - name: prowess-sf-mcp
    path: ../../apps/sap-mcp/dist
    memory: 256M
    instances: 1
    buildpacks: [nodejs_buildpack]
    command: node --enable-source-maps server.mjs
    health-check-type: http
    health-check-http-endpoint: /health
    routes:
      - route: prowess-sf-mcp-((env)).((domain))
    env:
      PROWESS_ENV: DEV
      MCP_DOMAINS: sf
      SF_MODE: odata
      SF_DESTINATION: SF_ODATA
      SF_SYSTEM_ID: SF-DEV
      SF_USER_MAPPING: email
      NODE_ENV: production
    services: [prowess-xsuaa, prowess-destination, prowess-logging, prowess-secrets]
  # Optional: Outlook (mail and calendar) as the signed-in user through Microsoft Graph (docs/outlook.md). Push it by name
  # without starting it, give it the IAS application (IAS_CLIENT_SECRET goes into prowess-secrets), then start it:
  #   cf push -f infrastructure/cloudfoundry/manifest.dev-lite.yml prowess-outlook-mcp --var env=… --var domain=… --no-start
  #   cf set-env prowess-outlook-mcp IAS_URL https://<tenant>.accounts.ondemand.com
  #   cf set-env prowess-outlook-mcp IAS_CLIENT_ID <client id of the IAS application XSUAA trusts>
  #   cf start prowess-outlook-mcp
  # OCR for scanned invoices (docs/invoice-intake.md): bind a SAP Document AI instance, then restage:
  #   cf create-service sap-document-information-extraction free prowess-document-ai
  #   cf bind-service prowess-outlook-mcp prowess-document-ai
  # The orchestrator needs IAS_URL too (to accept the IAS token the edge BFF forwards) and the service in MCP_SERVERS.
  - name: prowess-outlook-mcp
    path: ../../apps/sap-mcp/dist
    memory: 256M
    instances: 1
    buildpacks: [nodejs_buildpack]
    command: node --enable-source-maps server.mjs
    health-check-type: http
    health-check-http-endpoint: /health
    routes:
      - route: prowess-outlook-mcp-((env)).((domain))
    env:
      PROWESS_ENV: DEV
      MCP_DOMAINS: outlook
      OUTLOOK_MODE: graph
      OUTLOOK_TIME_ZONE: Arab Standard Time
      NODE_ENV: production
    services: [prowess-logging, prowess-secrets]
  - name: prowess-ai-orchestrator
    path: ../../apps/orchestrator/dist
    memory: 512M
    instances: 1
    buildpacks: [nodejs_buildpack]
    command: node --enable-source-maps server.mjs
    health-check-type: http
    health-check-http-endpoint: /api/health
    routes:
      # Public route like the MTA: every /api call requires an XSUAA token.
      - route: prowess-ai-orchestrator-((env)).((domain))
    env:
      PROWESS_ENV: DEV
      AUTH_MODE: xsuaa
      PERSISTENCE: memory
      LLM_ALLOW_MOCK: 'false'
      DEFAULT_LLM_PROVIDER: sap-ai-core
      # Orchestration deployment and resource group in the AI Core tenant of AICORE_SERVICE_KEY.
      AICORE_ORCHESTRATION_DEPLOYMENT_ID: de473292b4f30445
      AICORE_RESOURCE_GROUP: default
      OPENAI_COMPAT_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      OPENAI_COMPAT_STREAM_USAGE: 'true'
      # Gemini 3 always thinks before streaming; keep it short and allow for it.
      OPENAI_COMPAT_REASONING_EFFORT: minimal
      OPENAI_COMPAT_TIMEOUT_MS: '90000'
      LLM_REQUEST_TIMEOUT_MS: '240000'
      UPLOADS_ENABLED: 'false'
      SAP_MCP_URL: https://prowess-sap-mcp-((env)).((domain))/mcp
      NODE_ENV: production
    services: [prowess-xsuaa, prowess-logging, prowess-secrets]

  - name: prowess-ai-web
    path: ../approuter/dist
    memory: 256M
    instances: 1
    buildpacks: [nodejs_buildpack]
    routes:
      - route: prowess-((env)).((domain))
    env:
      INCOMING_CONNECTION_TIMEOUT: 300000
      destinations: >
        [{"name":"prowess-orchestrator","url":"https://prowess-ai-orchestrator-((env)).((domain))","forwardAuthToken":true,"timeout":300000}]
    # Destination and connectivity: Fiori under /sap/ on the workspace's own address (docs/sap-connectivity.md, Fiori pane).
    services: [prowess-xsuaa, prowess-destination, prowess-connectivity]

# Backend routes are public, as in mta.yaml: container-to-container network policies need
# network.write, which space developers do not have on every BTP landscape.
