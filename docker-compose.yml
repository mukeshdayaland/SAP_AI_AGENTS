# Optional local backing services. The app itself runs with `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prowess
      POSTGRES_PASSWORD: prowess # local only
      POSTGRES_DB: prowess
    ports: ['5432:5432']
    volumes: ['prowess-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prowess']
      interval: 5s

  clamav:
    image: clamav/clamav:stable
    ports: ['3310:3310']

volumes:
  prowess-pg:
